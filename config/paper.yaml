# Masthead and delivery settings. Edit freely.
name: "The Tone at the Top"
tagline: "Ethics & compliance industry news"
regions: "United States · Canada · United Kingdom · European Union"
site_url: "https://zizohamoui.github.io/Compliance-daily/"
timezone: "America/Vancouver"
cards_per_edition: 25
max_briefings: 3          # AI-written briefings for paywalled stories (keeps Claude usage low)
candidate_limit: 90       # max headlines handed to Claude each morning
lookback_hours: 96        # how far back to look (4 days covers weekends)
repo: "zizohamoui/Compliance-daily"   # used for the podcast upload link
podcast:
  days: 1     # 1 = a daily episode of that day's edition; 7 = a weekly recap
  keep: 14    # episodes kept online
# Audience tags the editor applies to each story (used only for the Industry and Persona filters).
industries:
  financial_services: "Financial services"
  healthcare: "Healthcare & life sciences"
  tech: "Technology"
  manufacturing_energy: "Manufacturing & energy"
  public_sector: "Public sector"
  all: "All industries"
personas:
  gc: "General counsel"
  clo: "Chief legal officer"
  cco: "Chief compliance officer"
  analyst: "Compliance analyst"
allow_official_images: false   # official preview images can show people; Commons images are filtered for people
