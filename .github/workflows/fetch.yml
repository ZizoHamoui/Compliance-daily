name: 1 · Fetch headlines
# Normally started within seconds when the Claude run pushes a claude/fetch-request-<date> branch.
# The timers are backups so a headlines-only edition still appears if the Claude run fails.
# Runs at most once per day.
on:
  schedule:
    - cron: "35 9 * * *"
    - cron: "35 10 * * *"
  workflow_dispatch:
    inputs:
      force: { description: "Run even if already fetched today", type: boolean, default: true }
  push:
    branches: ["claude/fetch-request-*"]   # the Claude run pushes a request branch when headlines are missing

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: repo-write
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
        with: { ref: main }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r requirements.txt
      - name: Fetch, score and dedupe
        run: python scripts/fetch.py ${{ (inputs.force == true || (github.event_name == 'push' && github.ref == 'refs/heads/main')) && '--force' || '' }}
      - id: commit
        name: Commit candidates
        run: |
          git config user.name "tone-at-the-top-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then echo "changed=0" >> $GITHUB_OUTPUT; exit 0; fi
          git commit -m "Candidates $(TZ=America/Vancouver date +%F)"
          git pull --rebase origin main && git push origin HEAD:main
          echo "changed=1" >> $GITHUB_OUTPUT
      - name: Remove the request branch
        if: always() && startsWith(github.ref, 'refs/heads/claude/fetch-request-')
        run: git push origin --delete "${GITHUB_REF#refs/heads/}" || true

  publish:
    needs: fetch
    if: needs.fetch.outputs.changed == '1' && github.ref == 'refs/heads/main'
    uses: ./.github/workflows/build.yml
