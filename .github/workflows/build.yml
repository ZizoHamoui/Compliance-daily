name: Build & publish site
# Renders the newspaper and deploys it to GitHub Pages. Called by the other workflows,
# and runs on its own when templates, scripts, config or editions change on main.
on:
  workflow_call:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["templates/**", "static/**", "scripts/build.py", "config/**", "editions/**"]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with: { ref: main }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r requirements.txt
      - run: python scripts/build.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: { path: site }
      - id: deploy
        uses: actions/deploy-pages@v4
