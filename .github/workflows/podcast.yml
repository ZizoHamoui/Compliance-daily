name: 5 · Publish podcast episode
# Two ways in:
#  - the podcast agent (Claude, driving NotebookLM in your Chrome) pushes claude/podcast-YYYY-MM-DD with podcast/inbox/<audio>
#  - you publish a GitHub Release with the NotebookLM audio attached (manual fallback)
# This converts the audio to MP3 (rejecting anything under 2.5 or over 25 minutes), keeps the newest episodes on the
# podcast-audio branch (so the main history stays small), records it in podcast/episodes.json, cleans up and republishes.
on:
  push:
    branches: ["claude/podcast-*"]
  release:
    types: [published]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: repo-write
  cancel-in-progress: false

jobs:
  convert:
    runs-on: ubuntu-latest
    outputs:
      added: ${{ steps.add.outputs.added }}
    steps:
      - uses: actions/checkout@v4
        with: { ref: main, fetch-depth: 0 }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r requirements.txt
      - name: Install ffmpeg
        run: command -v ffmpeg >/dev/null || (sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg)
      - name: Find the uploaded audio
        id: dl
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref_name }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          mkdir -p /tmp/inbox
          if [ "$EVENT" = "push" ]; then
            git fetch -q origin "$REF"
            for p in $(git ls-tree -r --name-only FETCH_HEAD -- podcast/inbox); do git show "FETCH_HEAD:$p" > "/tmp/inbox/$(basename "$p")"; done
            echo "tag=$REF" >> "$GITHUB_OUTPUT"
          else
            gh release download "$TAG" -D /tmp/inbox -R "$GITHUB_REPOSITORY" || true
            echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          fi
          f=$(find /tmp/inbox -maxdepth 1 -type f \( -iname '*.wav' -o -iname '*.m4a' -o -iname '*.mp3' -o -iname '*.aac' -o -iname '*.ogg' -o -iname '*.webm' -o -iname '*.mp4' \) -printf '%s %p\n' | sort -rn | head -1 | cut -d' ' -f2-)
          [ -z "$f" ] && echo "::warning::No audio file found, so nothing was published."
          echo "file=$f" >> "$GITHUB_OUTPUT"
      - name: Check out the audio branch
        if: steps.dl.outputs.file != ''
        run: |
          mkdir -p /tmp/audio
          if git fetch -q --depth 1 origin podcast-audio; then git archive FETCH_HEAD | tar -x -C /tmp/audio; fi
          ls -la /tmp/audio
      - name: Convert and register the episode
        id: add
        if: steps.dl.outputs.file != ''
        env:
          PODCAST_AUDIO_DIR: /tmp/audio
          TAG: ${{ steps.dl.outputs.tag }}
          NAME: ${{ github.event.release.name }}
        run: |
          python scripts/podcast.py add --input "${{ steps.dl.outputs.file }}" --tag "$TAG" --title "$NAME"
          git config --global user.name "tone-at-the-top-bot"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # audio branch: a single commit holding only the newest episodes (force-pushed, so old audio doesn't pile up)
          cd /tmp/audio && rm -rf .git && git init -q -b podcast-audio && git add -A && git commit -qm "Podcast audio (newest episodes)" \
            && git push -qf "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}.git" podcast-audio:podcast-audio
          cd "$GITHUB_WORKSPACE"
          git add podcast/episodes.json
          git commit -m "Podcast episode ${TAG##*podcast-}" || true
          git pull --rebase origin main && git push origin HEAD:main
          echo "added=1" >> "$GITHUB_OUTPUT"
      - name: Clean up the upload
        if: always() && steps.dl.outputs.tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref_name }}
          TAG: ${{ github.event.release.tag_name }}
          ADDED: ${{ steps.add.outputs.added }}
        run: |
          if [ "$EVENT" = "push" ]; then git push -q origin --delete "$REF" || true
          elif [ "$ADDED" = "1" ]; then gh release delete "$TAG" --cleanup-tag -y -R "$GITHUB_REPOSITORY"; fi

  publish:
    needs: convert
    if: needs.convert.outputs.added == '1'
    uses: ./.github/workflows/build.yml
