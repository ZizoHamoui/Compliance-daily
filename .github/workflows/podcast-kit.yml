name: 6 · Podcast kit (manual fallback)
# The podcast agent normally makes each episode. If you want to make one by hand, run this from the Actions tab:
# it emails you (GMAIL_ADDRESS, or PODCAST_PRODUCER if set) the latest edition's NotebookLM sources file,
# the prompt and a one-click upload link.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  kit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r requirements.txt
      - env:
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          PODCAST_PRODUCER: ${{ secrets.PODCAST_PRODUCER }}
        run: python scripts/podcast.py kit-email
