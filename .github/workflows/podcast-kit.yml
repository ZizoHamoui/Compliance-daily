name: 6 · Weekly podcast kit
# Sunday morning: emails you (the GMAIL_ADDRESS account, or PODCAST_PRODUCER if set) the week's NotebookLM
# sources file, the prompt and a one-click upload link. GitHub may run it a few hours late; that's fine.
# Run it by hand from the Actions tab any time you want a kit for the last 7 days.
on:
  schedule:
    - cron: "30 15 * * 0"   # Sundays ~8:30 a.m. Pacific
  workflow_dispatch:

permissions:
  contents: read

jobs:
  kit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r requirements.txt
      - env:
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          PODCAST_PRODUCER: ${{ secrets.PODCAST_PRODUCER }}
        run: python scripts/podcast.py kit-email
